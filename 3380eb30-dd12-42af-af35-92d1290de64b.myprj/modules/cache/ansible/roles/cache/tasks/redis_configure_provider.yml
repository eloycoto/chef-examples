---
- name: Ensure Redis user exists
  ansible.builtin.user:
    name: redis
    system: true
    group: redis
    shell: /bin/false
    home: "{{ redis_dir }}"
    createhome: false
- name: Ensure Redis group exists
  ansible.builtin.group:
    name: redis
    system: true
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: "{{ redis_config_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: "0755"
- name: Create Redis data directory
  ansible.builtin.file:
    path: "{{ redis_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true
- name: Create Redis PID directory
  ansible.builtin.file:
    path: /var/run/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ redis_log_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true
- name: Create Redis configuration file
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_config_file }}"
    owner: redis
    group: redis
    mode: "0644"
  notify: restart redis
- name: Create Redis systemd service file
  ansible.builtin.template:
    src: redis@.service.j2
    dest: /lib/systemd/system/redis@.service
    owner: root
    group: root
    mode: "0644"
  when: ansible_service_mgr == "systemd"
  notify: restart redis
- name: Create Redis init script
  ansible.builtin.template:
    src: redis.init.j2
    dest: /etc/init.d/redis{{ redis_port }}
    owner: root
    group: root
    mode: "0755"
  when: ansible_service_mgr != "systemd"
  notify: restart redis
