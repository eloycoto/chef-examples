---
redis_package_name: redis-server
redis_service_name: "{{ 'redis@' + redis_port | string if ansible_service_mgr == 'systemd' else 'redis' + redis_port | string }}"
redis_user: redis
redis_group: redis
redis_port: 6379
redis_bind: 127.0.0.1
redis_password: redis_secure_password_123
redis_maxmemory: 64mb
redis_maxmemory_policy: allkeys-lru
redis_dir: /var/lib/redis
redis_log_dir: /var/log/redis
redis_logfile: /var/log/redis/redis-server.log
redis_pidfile: /var/run/redis/redis-server.pid
redis_config_dir: /etc/redis
redis_config_file: /etc/redis/{{ redis_port }}.conf
redis_appendonly: "no"
redis_save:
  - 900 1
  - 300 10
  - 60 10000
redis_config_lines_to_remove:
  - replica-serve-stale-data
  - replica-read-only
  - repl-ping-replica-period
  - client-output-buffer-limit
  - replica-priority
