---
- name: Include memcached tasks
  ansible.builtin.import_tasks: memcached.yml
- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true
- name: Configure and enable Redis
  ansible.builtin.include_role:
    name: eloy.redis.redis
  vars:
    redis_port: 6379
    redis_requirepass: redis_secure_password_123
    redis_bind: 0.0.0.0
    redis_maxmemory: 64mb
    redis_maxmemory_policy: allkeys-lru
- name: Fix Redis configuration
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: "{{ item }}"
    state: absent
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  notify: Restart Redis
