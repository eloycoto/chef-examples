---
- name: Check if default Redis service exists (Debian/Ubuntu)
  ansible.builtin.stat:
    path: /lib/systemd/system/redis-server.service
  register: redis_debian_service
  when: ansible_os_family == 'Debian'
- name: Stop and disable default Redis service (Debian/Ubuntu)
  ansible.builtin.service:
    name: redis-server
    state: stopped
    enabled: false
  when:
    - ansible_os_family == 'Debian'
    - redis_debian_service.stat.exists | default(false)
  register: redis_debian_stop
  failed_when:
    - redis_debian_stop is failed
    - not 'Could not find the requested service' in redis_debian_stop.msg | default('')
- name: Check if default Redis service exists (RHEL/CentOS)
  ansible.builtin.stat:
    path: /lib/systemd/system/redis.service
  register: redis_rhel_service
  when: ansible_os_family == 'RedHat'
- name: Stop and disable default Redis service (RHEL/CentOS)
  ansible.builtin.service:
    name: redis
    state: stopped
    enabled: false
  when:
    - ansible_os_family == 'RedHat'
    - redis_rhel_service.stat.exists | default(false)
  register: redis_rhel_stop
  failed_when:
    - redis_rhel_stop is failed
    - not 'Could not find the requested service' in redis_rhel_stop.msg | default('')
