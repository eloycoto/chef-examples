---
- name: Install Redis from package (Debian/Ubuntu)
  ansible.builtin.apt:
    name: redis-server
    state: present
  when: ansible_os_family == 'Debian'
- name: Install Redis from package (RHEL/CentOS)
  ansible.builtin.dnf:
    name: redis
    state: present
  when: ansible_os_family == 'RedHat'
- name: Create Redis user
  ansible.builtin.user:
    name: "{{ redis_user }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: true
  when: ansible_service_mgr == 'systemd'
- name: Create Redis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0755"
  loop:
    - /var/lib/redis
    - /etc/redis
  when: ansible_service_mgr == 'systemd'
