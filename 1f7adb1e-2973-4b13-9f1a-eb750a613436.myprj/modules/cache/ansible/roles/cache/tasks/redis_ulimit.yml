---
- name: Configure PAM limits for Redis user (Debian/Ubuntu)
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    state: present
  loop:
    - redis soft nofile 65536
    - redis hard nofile 65536
  when: ansible_os_family == 'Debian'
- name: Configure PAM limits for Redis user (RHEL/CentOS)
  ansible.builtin.lineinfile:
    path: /etc/security/limits.d/redis.conf
    line: "{{ item }}"
    state: present
    create: true
    mode: "0644"
  loop:
    - redis soft nofile 65536
    - redis hard nofile 65536
  when: ansible_os_family == 'RedHat'
- name: Ensure PAM limits are included
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-session
    line: session required pam_limits.so
    state: present
  when: ansible_os_family == 'Debian'
