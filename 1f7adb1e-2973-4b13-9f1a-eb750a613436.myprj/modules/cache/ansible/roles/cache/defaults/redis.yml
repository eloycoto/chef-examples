---
redis_servers:
  - port: 6379
    requirepass: redis_secure_password_123
    bind: 127.0.0.1
    unixsocket: ""
    unixsocketperm: "755"
    timeout: 0
    loglevel: notice
    logfile: /var/log/redis/redis_6379.log
    databases: 16
    save:
      - 900 1
      - 300 10
      - 60 10000
    rdbcompression: "yes"
    dbfilename: dump.rdb
    dir: /var/lib/redis
    slaveof: ""
    masterauth: ""
    maxclients: 10000
    maxmemory: "0"
    maxmemory_policy: volatile-lru
    appendonly: "no"
    appendfsync: everysec
    no_appendfsync_on_rewrite: "no"
    auto_aof_rewrite_percentage: "100"
    auto_aof_rewrite_min_size: 64mb
redis_user: redis
redis_group: redis
redis_install_type: package
redis_package_name: redis-server
redis_source_url: http://download.redis.io/releases/redis-6.2.6.tar.gz
redis_source_sha: 5b2b8b7a50111ef395bf1c1d5be11e6e167ac018125055daa8b5c2317ae131ab
redis_source_dir: /tmp/redis
redis_source_install_dir: /usr/local
