---
- name: Install Redis package
  ansible.builtin.package:
    name: "{{ redis_package_name }}"
    state: present
  tags:
    - redis
    - packages
- name: Ensure Redis directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0755"
  loop:
    - "{{ redis_conf_dir }}"
    - "{{ redis_data_dir }}"
    - "{{ redis_log_dir }}"
  tags:
    - redis
    - directories
- name: Configure Redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_conf_dir }}/redis.conf"
    owner: "{{ redis_user }}"
    group: "{{ redis_group }}"
    mode: "0644"
  notify: Restart Redis
  tags:
    - redis
    - configuration
- name: Ensure Redis service is enabled and running
  ansible.builtin.service:
    name: "{{ redis_service_name }}"
    state: started
    enabled: true
  tags:
    - redis
    - services
