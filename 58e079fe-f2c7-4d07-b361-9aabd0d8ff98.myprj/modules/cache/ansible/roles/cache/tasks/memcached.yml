---
- name: Install memcached package
  ansible.builtin.package:
    name: memcached
    state: present
  tags:
    - memcached
    - packages
- name: Configure memcached
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: "{{ memcached_conf_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart memcached
  tags:
    - memcached
    - configuration
- name: Ensure memcached service is enabled and running
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
  tags:
    - memcached
    - services
