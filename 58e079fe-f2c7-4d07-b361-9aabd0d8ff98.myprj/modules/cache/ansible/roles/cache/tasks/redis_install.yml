---
- name: Install Redis server package for Debian/Ubuntu
  ansible.builtin.package:
    name: redis-server
    state: present
  when: ansible_os_family == "Debian"
- name: Install Redis server package for RedHat/CentOS
  ansible.builtin.package:
    name: redis
    state: present
  when: ansible_os_family == "RedHat"
- name: Create Redis user if it doesn't exist
  ansible.builtin.user:
    name: redis
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: true
- name: Create Redis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: redis
    group: redis
    mode: "0755"
  loop:
    - /var/lib/redis
    - /var/lib/redis/6379
    - /etc/redis
